[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "s-unified-developer"
version = "0.1.0"
description = "S local requirements workspace and unified toolchain catalog foundation"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
S = "s_developer.cli:main"

[tool.setuptools]
packages = ["continuum", "s_developer", "s_brain", "s_web_assets"]

[tool.setuptools.package-dir]
s_web_assets = "web"

[tool.setuptools.package-data]
s_web_assets = ["*.html", "*.js", "*.css"]
