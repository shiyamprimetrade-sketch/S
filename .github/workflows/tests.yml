name: AxiomFlow Continuum tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-teacherlab:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Train deterministic TeacherLab
        run: python -m continuum.lab_cli build --simulations 4000 --seed 20261109
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Report held-out evaluation
        run: python -m continuum.lab_cli evaluate
