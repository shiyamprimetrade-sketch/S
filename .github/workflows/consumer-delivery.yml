name: Consumer delivery
on:
  push:
    branches: [integration/project-s-unified]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  installed:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install build
      - run: python -m build --wheel
      - run: python scripts/verify_consumer_install.py
      - uses: actions/upload-artifact@v4
        with:
          name: project-s-wheel-${{ matrix.os }}
          path: dist/*.whl
          if-no-files-found: error
