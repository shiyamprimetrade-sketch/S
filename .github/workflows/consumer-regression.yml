name: Consumer regression
on:
  push:
    branches: [integration/project-s-unified]
  pull_request:
    paths:
      - 'project_s/**'
      - 'engine/arithmetic_verifier.py'
      - 'tests/test_*consumer.py'
      - 'tests/test_consumer_generation.py'
      - 'tests/test_http_product.py'
      - '.github/workflows/consumer-regression.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  consumer:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p 'test*consumer*.py' -v
      - run: python -m unittest discover -s tests -p 'test_http_product.py' -v
      - run: python -m pip install playwright==1.51.0
      - run: python -m playwright install --with-deps chromium
      - run: python tests/browser_acceptance.py
  installed:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install build
      - run: python -m build --wheel
      - run: python scripts/verify_consumer_install.py
      - uses: actions/upload-artifact@v4
        with:
          name: project-s-wheel-${{ matrix.os }}
          path: dist/*.whl
          if-no-files-found: error
