name: S controlled development acceptance
on:
  pull_request:
    paths:
      - 's_developer/**'
      - 'experiments/learned-*-copy-v*/**'
      - 'scripts/*_copy.py'
      - 'experiments/coding-curriculum-v*/**'
      - 'scripts/*coding_curriculum.py'
      - 'continuum/server.py'
      - 'web/**'
      - 'scripts/verify_controlled_development.py'
      - 'scripts/verify_capability_evaluation.py'
      - '.github/workflows/s-controlled-development.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  actual-container-builds:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify Docker availability
        run: docker --context default info
      - name: Actual isolated builds, tests, repair and permission checks
        run: python scripts/verify_controlled_development.py --approve-runtime-download --report build/controlled-acceptance.json
      - name: Independent coding oracle and false-success regression
        run: python scripts/verify_capability_evaluation.py --approve-runtime-download --report build/capability-oracle.json
      - name: Judge frozen neural programs against independent arithmetic cases
        run: |
          python scripts/verify_coding_curriculum.py --experiment experiments/coding-curriculum-v1 --approve-runtime-download --report build/coding-curriculum-execution-v1.json
          python scripts/verify_coding_curriculum.py --experiment experiments/coding-curriculum-v2 --approve-runtime-download --report build/coding-curriculum-execution-v2.json
          python scripts/verify_coding_curriculum.py --experiment experiments/coding-curriculum-v3 --approve-runtime-download --approve-requirements-literal-repair --report build/coding-curriculum-execution-v3.json
      - name: Require the declared literal-repair acceptance target
        run: |
          python -c "import json; r=json.load(open('build/coding-curriculum-execution-v3.json')); assert r['repair_target_met'] is True; assert r['models'][-1]['tasks_correct']==8; print('PASS: all eight final programs satisfy seven independent cases after at most one declared repair; unassisted results remain separately reported')"
      - name: Independent learned-copy programs without any repair
        run: |
          python scripts/verify_byte_copy.py --experiment experiments/learned-byte-copy-v1 --approve-runtime-download --report build/byte-copy-execution.json
          python scripts/verify_byte_copy.py --experiment experiments/learned-span-copy-v1 --approve-runtime-download --require-target --report build/span-copy-execution.json
      - name: Preserve actual execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: controlled-development-evidence
          path: |
            build/controlled-acceptance.json
            build/capability-oracle.json
            build/byte-copy-execution.json
            build/span-copy-execution.json
            build/coding-curriculum-execution-v1.json
            build/coding-curriculum-execution-v2.json
            build/coding-curriculum-execution-v3.json
          if-no-files-found: warn
