name: S controlled development acceptance
on:
  pull_request:
    paths:
      - 's_developer/**'
      - 'experiments/coding-curriculum-v*/**'
      - 'scripts/*coding_curriculum.py'
      - 'continuum/server.py'
      - 'web/**'
      - 'scripts/verify_controlled_development.py'
      - 'scripts/verify_capability_evaluation.py'
      - '.github/workflows/s-controlled-development.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  actual-container-builds:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify Docker availability
        run: docker --context default info
      - name: Actual isolated builds, tests, repair and permission checks
        run: python scripts/verify_controlled_development.py --approve-runtime-download --report build/controlled-acceptance.json
      - name: Independent coding oracle and false-success regression
        run: python scripts/verify_capability_evaluation.py --approve-runtime-download --report build/capability-oracle.json
      - name: Judge frozen neural programs against independent arithmetic cases
        run: |
          python scripts/verify_coding_curriculum.py --experiment experiments/coding-curriculum-v1 --approve-runtime-download --report build/coding-curriculum-execution-v1.json
          python scripts/verify_coding_curriculum.py --experiment experiments/coding-curriculum-v2 --approve-runtime-download --report build/coding-curriculum-execution-v2.json
      - name: Preserve actual execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: controlled-development-evidence
          path: |
            build/controlled-acceptance.json
            build/capability-oracle.json
            build/coding-curriculum-execution-v1.json
            build/coding-curriculum-execution-v2.json
          if-no-files-found: warn
