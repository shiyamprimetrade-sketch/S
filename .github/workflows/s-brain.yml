name: S-Brain experimental checks

on:
  pull_request:
    paths:
      - "s_brain/**"
      - ".github/workflows/s-brain.yml"
  push:
    branches:
      - "feature/s-brain-independent-transformer"
    paths:
      - "s_brain/**"
      - ".github/workflows/s-brain.yml"

permissions:
  contents: read

jobs:
  s-brain-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CPU PyTorch
        run: python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
      - name: Compile Python files
        run: python -m compileall -q s_brain
      - name: Unit tests
        run: python -m unittest discover -s s_brain/tests -v
