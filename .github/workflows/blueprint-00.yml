name: Blueprint 00 compatibility
on:
  push:
    branches: [feature/blueprint-00-master-integration]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compatibility:
    strategy:
      matrix:
        python: ['3.11', '3.12']
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -p 'test*consumer*.py' -v
      - run: python -m unittest discover -s tests -p 'test_http_product.py' -v
