name: Unity regression
on:
  push:
    branches: [integration/s-unity-003]
  pull_request:
    paths: ['unity/**', '.github/workflows/unity-regression.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - id: pins
        shell: bash
        run: |
          python -c "import json,os,re; p=json.load(open('unity/baseline.json')); f=open(os.environ['GITHUB_OUTPUT'],'a'); assert all(re.fullmatch('[0-9a-f]{40}',p[k]['commit']) for k in ('alpha','omega')); f.write('alpha='+p['alpha']['commit']+'\\nomega='+p['omega']['commit']+'\\n')"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: shiyamprimetrade-sketch/S-Alpha
          ref: ${{ steps.pins.outputs.alpha }}
          path: alpha
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: shiyamprimetrade-sketch/S-Omega
          ref: ${{ steps.pins.outputs.omega }}
          path: omega
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s unity -p 'test_*.py' -v
      - run: python -m unittest discover -s tests -v
        working-directory: alpha
      - run: python -m unittest discover -s tests -v
        working-directory: omega
      - if: runner.os == 'Linux'
        run: python fusion_acceptance.py ../alpha
        working-directory: omega
      - if: runner.os == 'Linux'
        run: python alpha_acceptance.py ../alpha
        working-directory: omega
      - if: runner.os == 'Linux'
        run: python integration/fusion_v3_acceptance.py ../omega
        working-directory: alpha
